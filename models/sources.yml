version: 2

sources:
  - name: raw_yahoo
    database: "{{ env_var('GCP_PROJECT_ID') }}"
    schema: "{{ env_var('BQ_DATASET_ID', 'raw_yahoo') }}"
    description: "Raw price data ingested from Yahoo Finance via yahoo_finance_ds.py"

    freshness:
      warn_after: {count: 3, period: day}
      error_after: {count: 7, period: day}
    loaded_at_field: ingestion_timestamp

    tables:
      - name: raw_yahoo_prices
        description: "Daily OHLCV prices for S&P majors and commodity futures"
        columns:
          - name: symbol
            description: "Ticker symbol (e.g. AAPL, GC=F)"
            tests:
              - not_null
          - name: trading_date
            description: "The date of the trading session"
            tests:
              - not_null
          - name: close
            description: "Closing price for the session"
          - name: volume
            description: "Volume traded"
          - name: ingestion_timestamp
            description: "UTC timestamp when this row was written to BigQuery"